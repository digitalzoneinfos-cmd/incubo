<!doctype html>
<html lang="fr">
<head>
<title>Incubo</title>
<meta charset="utf-8">
<script>try{var _t=localStorage.getItem("incubo:theme");if(_t==="dark"||_t==="light")document.documentElement.dataset.theme=_t}catch(e){}</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F7F80" data-light="#0F7F80" data-dark="#0B161B">
<meta name="description" content="Application étudiants de l'Incubateur de l'Université de Bouira : événements, formations, concours, annonces et questions.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Incubo">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout : mobile = coque d'application (en-tête, écran actif qui défile, barre d'onglets) ;
   bureau ≥ 960 px = site classique d'une page. Trois langues, l'arabe en RTL. */
:root{
  --snow:#F4F5F0;      /* fond, neige du Djurdjura */
  --paper:#FFFFFF;
  --ink:#13222A;       /* ardoise */
  --muted:#5D6A6F;
  --line:#E1E4DC;
  --ochre:#E59A2B;     /* accent, poterie kabyle */
  --ochre-soft:#FBEBD2;
  --cedar:#0F7F80;     /* bleu-vert officiel de l'incubateur */
  --cedar-soft:#D5EDEA;
  --leaf:#56B06A;
  --coral:#D4473B;
  --sky1:#D2ECEB; --sky2:#F7EBD8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r-lg:26px; --r-md:18px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
:root[lang="ar"]{--f-display:"Alexandria","Segoe UI",Tahoma,sans-serif;--f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}
:root[lang="ar"] *{letter-spacing:0!important}
html{overflow-x:hidden}
html,body{min-height:100%}
body{overflow-x:clip}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:32;background:var(--snow)}
body{background:var(--snow);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--cedar);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] svg.flip{transform:scaleX(-1)}

.stage{min-height:100%;display:block;
  background:radial-gradient(1200px 600px at 80% -10%,var(--ochre-soft),transparent 60%),radial-gradient(900px 600px at 0% 110%,var(--cedar-soft),transparent 60%),var(--snow)}
.app{position:relative;width:100%;max-width:440px;margin-inline:auto;min-height:100vh;background:var(--snow)}
@media (min-width:700px) and (max-width:959px){.app{box-shadow:0 0 0 1px var(--line)}}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;min-width:0;display:flex;align-items:center;gap:8px;padding-block:10px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--snow)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:38px;height:38px;border-radius:12px;background:var(--ink);display:grid;place-items:center;flex:none}
.brand b{font-family:"Bricolage Grotesque",var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em;display:block;line-height:1}
.brand small{font-size:11.5px;color:var(--muted);display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--paper);box-shadow:0 0 0 1px var(--line);position:relative;transition:transform .2s var(--ease);flex:none}
.iconbtn:active{transform:scale(.92)}
.dot{position:absolute;top:9px;inset-inline-end:10px;width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--paper)}
.langbtn{font-weight:700;font-size:13px;width:auto;padding-inline:11px;gap:5px;display:flex}
.langbtn svg.i{width:17px;height:17px}
.langmenu{position:absolute;top:calc(100% - 2px);inset-inline-end:max(16px,env(safe-area-inset-right,0px));z-index:35;background:var(--paper);border-radius:18px;padding:6px;min-width:170px;
  box-shadow:0 0 0 1px var(--line),0 24px 50px -20px rgba(19,34,42,.45);display:flex;flex-direction:column;gap:2px;transform-origin:top;opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;transition:opacity .2s,transform .3s var(--ease)}
.langmenu.on{opacity:1;transform:none;pointer-events:auto}
.langmenu button{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14.5px;text-align:start}
.langmenu button:hover{background:var(--snow)}
.langmenu button[aria-checked="true"]{background:var(--ochre-soft)}
.langmenu small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.langmenu .ar{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}

/* écrans (mobile) : chacun défile verticalement */
.screens{position:relative;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.screen{display:none;flex-direction:column;gap:16px;padding-block:6px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen.on{display:flex;animation:scrIn .45s var(--ease) both}
.screen.on.back{animation-name:scrBack}
@keyframes scrIn{from{opacity:0;transform:translateX(26px)}}
@keyframes scrBack{from{opacity:0;transform:translateX(-26px)}}
.screen>*{flex:none}
.h-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.h-row h2,.title{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.link{font-size:13px;font-weight:600;color:var(--cedar)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.small{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.small svg.i{width:15px;height:15px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--snow);letter-spacing:.02em;width:max-content}
.chip.ex{background:var(--ochre-soft);color:#8A5208}
.chip svg.i{width:14px;height:14px}

/* héros animé */
.hero{position:relative;height:clamp(380px,58vh,480px);border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(170deg,var(--sky1),var(--sky2))}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero.vid{background:#0B1C22}
.hero-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:86% 30%;display:none}
.hero.vid .hero-vid{display:block}
.hero-shade{position:absolute;inset:0;display:none;background:linear-gradient(180deg,rgba(8,22,28,.88) 0%,rgba(8,22,28,.45) 48%,rgba(8,22,28,.2) 70%,rgba(8,22,28,.7) 100%)}
.hero.vid .hero-shade{display:block}
.hero.vid .hero-copy h1{color:#fff}
.hero.vid .hero-copy h1 em{color:#62E0D4}
.hero.vid .hero-copy p{color:rgba(255,255,255,.86)}
.hero.vid .hero-copy .eyebrow{color:#7FE0D6!important}
.hero.vid .hero-next{background:rgba(255,255,255,.9)}
@media (min-width:960px){
  .hero-vid{object-position:center 35%}
  .hero-shade{background:linear-gradient(90deg,rgba(8,22,28,.9) 0%,rgba(8,22,28,.55) 45%,rgba(8,22,28,0) 70%),linear-gradient(0deg,rgba(8,22,28,.55),transparent 35%)}
  .hero.vid .hero-copy,.hero.vid .hero-next{inset-inline-start:auto;inset-inline-end:auto;left:56px;right:auto}
}
.proto-chip{display:inline-flex;width:max-content;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.14);color:#DDF5F2;letter-spacing:.04em}
.official .proto-chip{display:none}
.hero.vid .hero-copy{z-index:2;pointer-events:none}
.hero-next{z-index:3}
@media (min-width:960px){
}
.hero-copy{position:absolute;left:18px;right:18px;top:18px;display:flex;flex-direction:column;gap:8px}
.hero-copy h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8.4vw,36px);line-height:1.02;letter-spacing:-.035em;margin:0;max-width:12ch;text-wrap:balance}
:root[lang="ar"] .hero-copy h1{line-height:1.3;max-width:14ch}
.hero-copy h1 em{font-style:normal;color:var(--cedar)}
.hero-copy p{margin:0;font-size:13.5px;color:#2E3F46;max-width:30ch;line-height:1.45}
.hero-next{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);
  background:rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 24px -12px rgba(19,34,42,.4);text-align:start}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--coral);letter-spacing:.06em;text-transform:uppercase}
.live i{width:7px;height:7px;border-radius:50%;background:var(--coral);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,71,59,.5)}80%{box-shadow:0 0 0 8px rgba(212,71,59,0)}}
.hero-next .t{flex:1;min-width:0}
.hero-next .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;display:flex;gap:6px;direction:ltr;justify-content:flex-start}
[dir="rtl"] .cd{justify-content:flex-end}
.cd span{background:var(--ink);color:var(--snow);border-radius:6px;padding:2px 5px}
.go{width:38px;height:38px;border-radius:12px;background:var(--ochre);display:grid;place-items:center;flex:none}

/* actions rapides */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.15}
.q .ic{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--paper);box-shadow:0 0 0 1px var(--line);transition:transform .25s var(--ease)}
.q:active .ic{transform:scale(.9) rotate(-4deg)}
.q:nth-child(1) .ic{background:var(--ink);color:var(--snow);box-shadow:none}
.q:nth-child(2) .ic{color:var(--coral)} .q:nth-child(3) .ic{color:var(--cedar)} .q:nth-child(4) .ic{color:#B06B0C}

/* slider */
.une{display:flex;flex-direction:column;gap:10px}
.rail{height:270px;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;padding-bottom:4px;scrollbar-width:none;perspective:900px}
.rail::-webkit-scrollbar{display:none}
.slide{flex:0 0 76%;scroll-snap-align:start;border-radius:var(--r-md);position:relative;overflow:hidden;text-align:start;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
  background:var(--paper);box-shadow:0 0 0 1px var(--line);transform-style:preserve-3d;transition:transform .25s var(--ease)}
.slide .art{position:absolute;inset:0 0 auto 0;height:52%}
.slide .meta{position:relative;display:flex;flex-direction:column;gap:5px}
.slide b{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}

/* art génératif : motifs kabyles */
.art{background:var(--g,linear-gradient(135deg,var(--cedar),#2E7A63))}
.art::before{content:"";position:absolute;inset:0;opacity:.22;background-image:var(--motif);background-size:36px 36px}
.art .big{position:absolute;inset-inline-end:14px;top:12px;color:rgba(255,255,255,.95)}
.art .big svg.i{width:46px;height:46px;stroke-width:1.4}
.art.photo{background-size:cover;background-position:center 30%}
.poster{width:min(340px,100%);border-radius:14px;box-shadow:0 14px 30px -14px rgba(19,34,42,.5)}
.logo img{display:none}
.official .logo{background:none!important;overflow:hidden}
.official .logo svg{display:none}
.official .logo img{display:block;width:100%;height:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--paper);border-radius:var(--r-md);box-shadow:0 0 0 1px var(--line);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:start;min-width:0}
.st .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--cedar-soft);color:var(--cedar)}
.st .ic svg.i{width:18px;height:18px}
.st b{font-family:"Bricolage Grotesque",var(--f-display);font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
[dir="rtl"] .st b{text-align:right}
.st span{font-size:12.5px;color:var(--muted);line-height:1.35}
.st.big{grid-column:1/-1;background:linear-gradient(140deg,#139AA2,#56B06A);box-shadow:none;color:#fff;padding:18px}
.st.big .ic{background:rgba(255,255,255,.2);color:#fff}
.st.big b{font-size:64px;color:#fff}.st.big span{color:rgba(255,255,255,.92);font-size:14px}
.st.cta{background:var(--ink);box-shadow:none;justify-content:space-between;cursor:pointer}
.st.cta span{color:#C9D2D4}.st.cta strong{color:var(--snow);font-size:15px;display:flex;align-items:center;gap:6px}
@media (min-width:960px){.stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.st{padding:20px}.st b{font-size:44px}.st.big{grid-column:span 2;grid-row:span 2;justify-content:flex-end}.st.big b{font-size:110px}.st.big span{font-size:17px}}
.about{margin:0;border-radius:var(--r-lg);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.about img{display:block;width:100%;height:auto}
.art.photo::before{background:linear-gradient(180deg,rgba(19,34,42,0) 45%,rgba(19,34,42,.55));opacity:1}
.art.photo .big{display:none}
.album{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.album img{flex:0 0 82%;scroll-snap-align:center;aspect-ratio:4/3;object-fit:cover;border-radius:16px;max-width:none}
.band{height:10px;background-image:var(--motif-band);background-size:20px 10px;opacity:.9}

/* programmes */
.progs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog{background:var(--paper);border-radius:var(--r-md);box-shadow:0 0 0 1px var(--line);padding:14px;display:flex;flex-direction:column;gap:8px}
.prog .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--cedar-soft);color:var(--cedar)}
.prog:nth-child(2) .ic{background:var(--ochre-soft);color:#8A5208}.prog:nth-child(3) .ic{background:#F6DEDA;color:var(--coral)}.prog:nth-child(4) .ic{background:#DCE8EF;color:#2F6F86}
.prog b{font-family:var(--f-display);font-size:15px;line-height:1.2}
.prog p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}

/* partenaires : bandeau défilant */
.marquee{overflow:hidden;margin-inline:-16px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;gap:10px;width:max-content;animation:mq 38s linear infinite;padding-block:2px}
[dir="rtl"] .track{animation-name:mqr}
.track span{font-family:var(--f-mono);font-size:12.5px;font-weight:500;padding:9px 14px;border-radius:999px;background:var(--paper);box-shadow:0 0 0 1px var(--line);white-space:nowrap;direction:ltr}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes mqr{to{transform:translateX(50%)}}

/* contact */
.contact{border-radius:var(--r-lg);background:var(--ink);color:#C9D2D4;padding:16px;display:flex;flex-direction:column;gap:12px}
.contact .title{color:var(--snow)}
.crow{display:flex;align-items:center;gap:12px}
.crow .ic{width:38px;height:38px;border-radius:12px;background:#22353E;display:grid;place-items:center;color:var(--ochre);flex:none}
.crow .v{flex:1;min-width:0;font-size:14px;color:var(--snow);user-select:text;overflow-wrap:anywhere}
.crow .v small{display:block;color:#8FA0A5;font-size:11.5px}
.crow button{font-size:12px;font-weight:700;color:var(--ochre);padding:8px 10px;border-radius:10px;background:#22353E}
.src{font-size:11.5px;color:var(--muted);line-height:1.4}

/* segment */
.seg{display:flex;gap:6px;background:var(--paper);padding:5px;border-radius:16px;box-shadow:0 0 0 1px var(--line);position:relative}
.seg button{flex:1;padding:9px 4px;border-radius:12px;font-size:13px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color .25s;white-space:nowrap}
.seg button[aria-selected="true"]{color:var(--snow)}
.seg .pill{position:absolute;top:5px;bottom:5px;border-radius:12px;background:var(--ink);transition:left .4s var(--ease),width .4s var(--ease)}

/* deck 3D */
.deck{position:relative;height:min(500px,max(420px,58vh));perspective:1100px;touch-action:pan-y}
.card{position:absolute;inset:0 6% 18px;border-radius:var(--r-lg);background:var(--paper);box-shadow:0 18px 40px -22px rgba(19,34,42,.45),0 0 0 1px var(--line);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .55s var(--ease),opacity .4s;will-change:transform;text-align:start;user-select:none}
.card .art{position:relative;flex:1 1 46%;min-height:0}
.card .body{flex:0 0 auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.card h3{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.deck-foot{display:flex;align-items:center;justify-content:space-between}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line);transition:width .35s var(--ease),background .35s}
.dots i.on{width:22px;background:var(--ink)}
.arrows{display:flex;gap:8px}
.arrows button{width:40px;height:40px;border-radius:13px;background:var(--paper);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center}

/* Agenda */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 52px;padding:8px 0;border-radius:14px;background:var(--paper);box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
.day b{font-family:var(--f-mono);font-weight:500;font-size:18px;color:var(--ink)}
.day.has::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ochre);position:absolute;bottom:5px}
.day.on{background:var(--ink);color:#C9D2D4;box-shadow:none}.day.on b{color:var(--snow)}
.flow{position:relative;height:510px;perspective:1000px;touch-action:pan-y}
.fl{position:absolute;top:0;bottom:8px;left:50%;width:76%;border-radius:var(--r-lg);overflow:hidden;background:var(--paper);box-shadow:0 20px 40px -22px rgba(19,34,42,.5),0 0 0 1px var(--line);
  display:flex;flex-direction:column;transition:transform .6s var(--ease),opacity .4s,filter .4s;text-align:start}
.fl .art{position:relative;flex:1 1 36%;min-height:0}
.fl .datebig{position:absolute;inset-inline-start:14px;bottom:12px;color:#fff;font-family:var(--f-display);line-height:.95}
.fl .datebig b{font-family:"Bricolage Grotesque",var(--f-display);font-size:44px;font-weight:800;display:block;letter-spacing:-.04em}
.fl .datebig span{font-size:13px;font-weight:600}
.fl .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.fl h3{margin:0;font-family:var(--f-display);font-size:17.5px;line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
.seats{height:6px;border-radius:6px;background:var(--snow);overflow:hidden}
.seats i{display:block;height:100%;background:linear-gradient(90deg,var(--cedar),var(--ochre));border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;background:var(--ink);color:var(--snow);transition:transform .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.ochre{background:var(--ochre);color:var(--ink)}
.btn.ghost{background:var(--snow);color:var(--ink)}
.btn.done{background:var(--cedar-soft);color:var(--cedar)}
.btn svg.i{width:18px;height:18px}

/* Galerie */
.ringwrap{position:relative;height:400px;perspective:900px;display:grid;place-items:center;touch-action:pan-y;cursor:grab;overflow:hidden}
.ring{position:relative;width:46%;aspect-ratio:3/4;max-height:80%;transform-style:preserve-3d}
.tile{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;box-shadow:0 20px 40px -20px rgba(19,34,42,.55);display:flex;align-items:flex-end;padding:12px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:14.5px;line-height:1.2;text-align:start}
.tile .art{position:absolute;inset:0}
.tile span{position:relative;text-shadow:0 1px 10px rgba(0,0,0,.25)}
.floor{position:absolute;left:10%;right:10%;bottom:4%;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(19,34,42,.18),transparent)}
.cap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--paper);box-shadow:0 0 0 1px var(--line)}
.cap b{font-family:var(--f-display);font-size:15.5px;display:block;line-height:1.25}
.cap>div{min-width:0}
.glist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gl{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:4/3;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:700;font-size:12.5px;line-height:1.25;text-align:start;max-width:100%}
.gl .art{position:absolute;inset:0}.gl .art .big svg.i{width:28px;height:28px}
.gl span{position:relative}

/* Questions */
.faq{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.faq::-webkit-scrollbar{display:none}
.fq{flex:0 0 80%;scroll-snap-align:start;border-radius:var(--r-md);padding:14px;background:var(--cedar);color:#EAF2EE;display:flex;flex-direction:column;gap:6px;text-align:start;min-height:120px}
.fq:nth-child(2n){background:var(--ink)}
.fq b{font-family:var(--f-display);font-size:15.5px;color:#fff;line-height:1.25}
.fq p{margin:0;font-size:13px;line-height:1.45;opacity:.92;overflow-wrap:anywhere}
.ask{border-radius:var(--r-lg);background:var(--paper);box-shadow:0 0 0 1px var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--snow);color:var(--muted);transition:all .2s}
.cats button[aria-pressed="true"]{background:var(--ochre);color:var(--ink)}
textarea{width:100%;box-sizing:border-box;border:0;resize:none;background:var(--snow);border-radius:14px;padding:12px;font-size:14px;height:90px;line-height:1.45}
textarea:focus{outline:2px solid var(--cedar)}
.ask .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mine{display:flex;flex-direction:column;gap:8px}
.qa{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:14px;background:var(--paper);box-shadow:0 0 0 1px var(--line);animation:pop .5s var(--ease)}
.qa .s{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.qa .s.wait{background:var(--ochre-soft);color:#8A5208}.qa .s.ok{background:var(--cedar-soft);color:var(--cedar)}
.qa p{margin:0;font-size:13.5px;flex:1;min-width:0;line-height:1.4}
.qa small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}

/* barre d'onglets */
.nav{position:fixed;bottom:0;left:0;right:0;margin-inline:auto;max-width:440px;box-sizing:border-box;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);position:relative}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;position:relative;z-index:1;transition:color .3s;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg.i{transform:translateY(-2px);stroke-width:2.2}
.nav svg.i{transition:transform .35s var(--ease)}
.nav .blob{position:absolute;top:6px;height:44px;width:56px;border-radius:16px;background:var(--ochre-soft);transition:left .45s var(--ease)}

/* surcouches */
.scrim{position:fixed;inset:0;background:rgba(19,34,42,.42);opacity:0;pointer-events:none;transition:opacity .3s;z-index:36}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin-inline:auto;max-width:440px;box-sizing:border-box;z-index:37;background:var(--paper);border-radius:28px 28px 0 0;padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  transform:translateY(105%);transition:transform .45s var(--ease);max-height:88%;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 4px;flex:none}
.sheet h3{font-family:var(--f-display);font-size:21px;letter-spacing:-.02em;margin:0;line-height:1.2;text-wrap:balance}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{border:0;background:var(--snow);border-radius:13px;padding:12px;font-size:15px;box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .2s;min-width:0;width:100%;box-sizing:border-box}
.field input:focus,.field select:focus{outline:0;box-shadow:inset 0 0 0 2px var(--cedar)}
.field .err{font-size:12px;color:var(--coral)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ticket{border-radius:20px;background:var(--ink);color:var(--snow);display:flex;gap:14px;padding:14px;align-items:center}
.ticket canvas{width:96px;height:96px;background:#fff;border-radius:10px;flex:none}
.ticket b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.2}
.ticket small{font-family:var(--f-mono);font-size:11.5px;opacity:.75}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:center;font-size:14px;padding:10px 12px;border-radius:14px;background:var(--snow)}
.steps li span{width:28px;height:28px;border-radius:9px;background:var(--ink);color:var(--snow);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}
.notif{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--snow);text-align:start;width:100%}
.notif .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--paper);flex:none;color:var(--cedar)}
.notif p{margin:0;font-size:13.5px;line-height:1.4}.notif small{color:var(--muted);font-size:12px}

/* détail */
.detail{position:fixed;inset:0;margin-inline:auto;max-width:440px;z-index:34;background:var(--paper);display:flex;flex-direction:column;clip-path:circle(0% at var(--ox,50%) var(--oy,50%));transition:clip-path .6s var(--ease);visibility:hidden}
.detail.on{clip-path:circle(150% at var(--ox,50%) var(--oy,50%));visibility:visible}
.detail .art{position:relative;flex:0 0 34%}
.detail .close{position:absolute;top:12px;inset-inline-start:max(12px,env(safe-area-inset-left,0px));width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:2}
.detail .content{flex:1;min-height:0;overflow-y:auto;padding-block:18px 10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.detail h2{font-family:var(--f-display);font-size:24px;letter-spacing:-.025em;line-height:1.15;margin:0;text-wrap:balance}
.detail p{margin:0;font-size:14.5px;line-height:1.6;color:#33444B;max-width:62ch}
.detail .facts{display:flex;flex-wrap:wrap;gap:8px}
.detail .cta{flex:none;display:flex;gap:10px;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-top:1px solid var(--line)}
.detail .cta .btn{flex:1}

/* installation, toast, ouverture */
.install{position:fixed;left:12px;right:12px;margin-inline:auto;max-width:416px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:var(--ink);color:var(--snow);
  box-shadow:0 20px 40px -16px rgba(19,34,42,.6);transform:translateY(30px);opacity:0;pointer-events:none;transition:all .5s var(--ease)}
.install.on{transform:none;opacity:1;pointer-events:auto}
.install .t{flex:1;min-width:0}.install b{display:block;font-size:14px}.install small{font-size:12px;opacity:.75}
.install .x{width:30px;height:30px;display:grid;place-items:center;color:#9FB0B5}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;transform:translate(-50%,-80px);background:var(--ink);color:var(--snow);padding:10px 16px;border-radius:14px;font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center;transition:transform .45s var(--ease);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.boot{position:fixed;inset:0;z-index:70;background:var(--ink);display:grid;place-items:center;transition:clip-path .8s var(--ease) .1s;clip-path:inset(0 0 0 0)}
.boot.off{clip-path:inset(0 0 100% 0);pointer-events:none}
.boot svg{width:84px;height:84px}
.boot path{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.screen.on .stag{animation:rise .7s var(--ease) both}
.screen.on .stag:nth-child(2){animation-delay:.08s}.screen.on .stag:nth-child(3){animation-delay:.16s}.screen.on .stag:nth-child(4){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* ===== Coque mobile : seul le contenu défile, en-tête et barre d'onglets restent à l'écran ===== */
@media (max-width:959px){
  html,body{height:100%;overflow:hidden}
  .stage{height:100%}
  .app{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .top{position:relative;top:auto;flex:none}
  .screens{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:14px;scrollbar-width:none}
  .screens::-webkit-scrollbar{display:none}
  .nav{position:relative;flex:none;left:auto;right:auto;bottom:auto;max-width:none;margin:0 10px calc(10px + env(safe-area-inset-bottom,0px));padding:6px;
    border-radius:24px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.8);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    box-shadow:0 18px 40px -18px rgba(19,34,42,.45),0 0 0 1px rgba(19,34,42,.05)}
  .nav .blob{top:6px;height:calc(100% - 12px);border-radius:18px;background:linear-gradient(135deg,#139AA2,#56B06A);box-shadow:0 8px 18px -8px rgba(19,154,162,.7)}
  .nav button[aria-current="page"]{color:#fff}
  .install{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
/* ===== Habillage moderne ===== */
:root{--grad:linear-gradient(135deg,#139AA2,#56B06A);--sh:0 0 0 1px rgba(19,34,42,.06),0 10px 30px -18px rgba(19,34,42,.35);--r-lg:28px;--r-md:20px}
.app{background:radial-gradient(520px 380px at 100% 0%,rgba(19,154,162,.11),transparent 62%),radial-gradient(480px 420px at 0% 45%,rgba(86,176,106,.09),transparent 62%),var(--snow)}
.top{background:rgba(244,245,240,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.iconbtn,.slide,.prog,.st,.card,.fl,.cap,.ask,.qa,.seg,.day,.arrows button{box-shadow:var(--sh)}
.q .ic{box-shadow:var(--sh)}
.q:nth-child(1) .ic{background:var(--grad);box-shadow:0 10px 22px -10px rgba(19,154,162,.75)}
.screen>.h-row h2,.screen>.h-row .title{position:relative}
.screen>.h-row h2::after,.screen>.h-row .title::after{content:"";display:block;width:26px;height:4px;border-radius:4px;background:var(--grad);margin-top:7px}
.seg .pill,.day.on,.dots i.on{background:var(--grad)}
.day.on{box-shadow:0 10px 20px -10px rgba(19,154,162,.7)}
.btn{background:linear-gradient(135deg,#13222A,#24414B);box-shadow:0 10px 22px -12px rgba(19,34,42,.7)}
.btn.ochre{background:linear-gradient(135deg,#F2B04A,#E58E1F);color:#13222A;box-shadow:0 10px 22px -12px rgba(229,142,31,.8)}
.btn.ghost{background:var(--snow);box-shadow:none}
.btn.done{background:var(--cedar-soft);box-shadow:none}
.desk-cta{background:var(--grad)!important;color:#fff}
.prog .ic{background:var(--grad)!important;color:#fff!important}
.st .ic{background:var(--grad);color:#fff}
.hero{box-shadow:0 30px 60px -34px rgba(8,22,28,.7)}
.hero-next{border:1px solid rgba(255,255,255,.6);border-radius:20px}
.chip{background:rgba(19,34,42,.05)}
.slide,.card,.fl{transition:transform .35s var(--ease),box-shadow .35s,translate .3s var(--ease)}
.fq{background:linear-gradient(150deg,#0F7F80,#2E9E7A)}.fq:nth-child(2n){background:linear-gradient(150deg,#13222A,#24414B)}
/* vidéo du hero floutée */
.hero-vid{filter:blur(4px) saturate(1.1);transform:scale(1.06)}
/* intro */
.intro{position:fixed;inset:0;z-index:80;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,#16A3AE 0%,#2FB79A 55%,#5DC46F 100%);transition:opacity .7s var(--ease),visibility .7s}
.intro.off{opacity:0;visibility:hidden}
.intro video{width:100%;height:100%;object-fit:cover;max-width:none}
@media (max-aspect-ratio:1/1){.intro video{width:155%;height:auto;object-fit:contain;-webkit-mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent)}}
.intro-skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.2);
  color:#fff;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
[dir="rtl"] .intro-skip{right:auto;left:max(16px,env(safe-area-inset-left,0px))}
/* éléments réservés au bureau */
.desk-nav,.desk-cta,.foot{display:none}
.desk-nav{flex:1;justify-content:center;gap:2px}
.desk-nav button{padding:9px 13px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--muted);transition:color .2s,background .2s;white-space:nowrap}
.desk-nav button:hover{color:var(--ink);background:var(--paper)}
.desk-nav button.on{color:var(--ink);background:var(--ochre-soft)}
.foot{background:var(--ink);color:#B9C4C7}
.foot-in{max-width:1200px;margin:0 auto;padding:56px 32px 40px;box-sizing:border-box;display:grid;grid-template-columns:1.1fr 2fr;gap:40px}
.foot .brand b{color:var(--snow)}.foot .brand small{color:#8FA0A5}
.foot p{margin:8px 0 0;font-size:14px;line-height:1.6;max-width:42ch;user-select:text}
.foot-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.foot .eyebrow{color:var(--ochre)}
.foot-bottom{grid-column:1/-1;border-top:1px solid #2A3C44;padding-top:20px;font-size:12.5px;color:#7F9196;display:flex;justify-content:space-between;gap:16px}

/* ===== Bureau : site web classique ===== */
@media (min-width:960px){
  .stage{background:var(--snow)}
  .app{max-width:none;min-height:0}
  .screens{padding-bottom:0}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;gap:12px;padding-block:14px;padding-left:max(32px,calc((100% - 1200px)/2 + 32px));padding-right:max(32px,calc((100% - 1200px)/2 + 32px));
    background:rgba(244,245,240,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .langmenu{inset-inline-end:max(32px,calc((100% - 1200px)/2 + 32px))}
  .brand{flex:0 0 auto}
  .desk-nav{display:flex}
  .desk-cta{display:inline-flex}
  #btnInstall,.nav,.install{display:none!important}
  .foot{display:block}
  .screens{overflow:visible}
  .screen,.screen.on{display:flex;animation:none;max-width:1200px;margin-inline:auto;box-sizing:border-box;
    padding-block:72px 16px;padding-left:32px;padding-right:32px;gap:24px;scroll-margin-top:60px}
  .h-row h2,.title{font-size:38px;letter-spacing:-.03em}
  .h-row .small{font-size:14px}
  .screen[data-screen="accueil"]{padding-top:28px}
  .hero{height:min(620px,74vh);min-height:480px;border-radius:34px}
  .hero-copy{left:auto;right:auto;inset-inline-start:56px;top:64px;max-width:620px;gap:14px}
  .hero-copy h1{font-size:72px;max-width:11ch}
  :root[lang="ar"] .hero-copy h1{font-size:62px;max-width:13ch}
  .hero-copy p{font-size:18px;max-width:36ch}
  .hero-next{left:auto;right:auto;inset-inline-start:56px;bottom:44px;width:460px;padding:14px 16px}
  .quick{gap:16px}
  .q{flex-direction:row;justify-content:flex-start;gap:14px;padding:16px;border-radius:20px;background:var(--paper);box-shadow:0 0 0 1px var(--line);font-size:15px;text-align:start;transition:transform .25s var(--ease),box-shadow .25s}
  .q:hover{transform:translateY(-3px);box-shadow:0 0 0 1px var(--line),0 16px 30px -18px rgba(19,34,42,.4)}
  .q .ic{width:48px;height:48px;box-shadow:none;background:var(--snow)}
  .une{gap:16px}
  .rail{display:grid;grid-template-columns:repeat(5,1fr);overflow:visible;margin-inline:0;padding-inline:0;height:340px;gap:16px}
  .slide{flex:none}
  .progs{grid-template-columns:repeat(4,1fr);gap:16px}
  .prog{padding:20px;gap:10px}.prog b{font-size:17px}.prog p{font-size:14px}
  .marquee{margin-inline:0}
  .contact{display:none}
  .seg{max-width:620px}
  .deck{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:22px;perspective:none;height:auto}
  .card{position:relative;inset:auto;height:450px;transform:none!important;opacity:1!important;pointer-events:auto!important;cursor:pointer;transition:translate .3s var(--ease),box-shadow .3s}
  .card:hover,.fl:hover{translate:0 -5px}
  .deck-foot{display:none}
  .days{margin-inline:0;padding-inline:0}
  .flow{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:20px;perspective:none;height:auto}
  .fl{position:relative;top:auto;bottom:auto;left:auto;width:auto;height:490px;transform:none!important;opacity:1!important;filter:none!important;pointer-events:auto!important;transition:translate .3s var(--ease),box-shadow .3s}
  .fl.pick{box-shadow:0 0 0 2.5px var(--ochre),0 20px 40px -22px rgba(19,34,42,.5)}
  .ringwrap{height:500px;border-radius:34px;background:linear-gradient(170deg,var(--sky1),var(--sky2))}
  .ring{width:250px;max-height:none}
  .cap{max-width:620px;width:100%;margin-inline:auto;box-sizing:border-box}

 {id:'a12',g:'cedar',icon:'hand',ph:'cafe',poster:'cafe',day:'2026-05-18',tag:['Café d\'affaires','Business café','مقهى الأعمال'],
  title:['Café d\'affaires avec SARL Bettar Industrie','Business café with SARL Bettar Industrie','مقهى الأعمال مع SARL Bettar Industrie'],
  ex:['Le 18 mai 2026 à l\'incubateur : une rencontre entre les porteurs de projets et un industriel de la mécanique pour le secteur énergétique.','On 18 May 2026 at the incubator: a meeting between project holders and a mechanical manufacturer serving the energy sector.','يوم 18 ماي 2026 بالحاضنة: لقاء بين حاملي المشاريع ومؤسسة صناعية في الميكانيك موجهة لقطاع الطاقة.'],
  body:[['SARL Bettar Industrie est spécialisée dans la fabrication et la maintenance de pièces mécaniques destinées au secteur énergétique.','Objectifs de la rencontre : découvrir les besoins du marché, développer son réseau, explorer des pistes de collaboration et établir des partenariats durables.','« L\'incubateur, votre partenaire pour transformer vos idées en succès. »'],
        ['SARL Bettar Industrie manufactures and maintains mechanical parts for the energy sector.','Goals: discover market needs, grow your network, explore collaboration and build lasting partnerships.','"The incubator, your partner to turn your ideas into success."'],
        ['تختص SARL Bettar Industrie في تصنيع وصيانة القطع الميكانيكية الموجهة لقطاع الطاقة.','أهداف اللقاء: اكتشاف احتياجات السوق، توسيع شبكة العلاقات، استكشاف فرص التعاون وبناء شراكات دائمة.','«الحاضنة، شريكك لتحويل أفكارك إلى نجاح.»']]},
 {id:'a10',g:'ink',icon:'spark',ph:'aisummit',poster:'aisummit',day:'2026-05-13',tag:['AI Summit 2026','AI Summit 2026','قمة الذكاء الاصطناعي 2026'],
  title:['AI : de la conception à la production','AI: from conception to production','الذكاء الاصطناعي: من التصميم إلى الإنتاج'],
  ex:['Conférence plénière de l\'AI Summit 2026, le 13 mai 2026, avec Mounir Ouadi : de la recherche aux systèmes réels.','Keynote of the AI Summit 2026 on 13 May 2026 with Mounir Ouadi: from research to real-world systems.','المحاضرة الرئيسية لقمة الذكاء الاصطناعي 2026 يوم 13 ماي 2026 مع منير وادي: من البحث إلى الأنظمة الحقيقية.'],
  body:[['Mounir Ouadi est ingénieur en IA embarquée et chercheur, directeur scientifique et responsable de l\'IA chez Qareeb.','Thèmes : edge AI, vision par ordinateur, systèmes embarqués, IA industrielle, IA de santé portable et bio-informatique.','Entrée ouverte aux porteurs de projets et aux étudiants, sur inscription (places limitées).'],
        ['Mounir Ouadi is an Edge AI engineer and researcher, Chief Scientific Officer and Head of AI at Qareeb.','Topics: edge AI, computer vision, embedded systems, industrial AI, wearable health AI and bioinformatics.','Open to project holders and students, with registration (limited seats).'],
        ['منير وادي مهندس في الذكاء الاصطناعي المدمج وباحث، والمدير العلمي ومسؤول الذكاء الاصطناعي في Qareeb.','المحاور: الذكاء الاصطناعي الطرفي، الرؤية الحاسوبية، الأنظمة المدمجة، الذكاء الاصطناعي الصناعي، الصحة القابلة للارتداء والمعلوماتية الحيوية.','الدخول مفتوح لحاملي المشاريع والطلبة بالتسجيل المسبق (أماكن محدودة).']]},
 {id:'a11',g:'ochre',icon:'users',ph:'coaching',poster:'coaching',day:'2026-05-14',tag:['Mentorat','Mentoring','مرافقة'],
  title:['Séances de coaching et de suivi des projets innovants','Coaching and monitoring sessions for innovation projects','جلسات توجيه ومتابعة المشاريع المبتكرة'],
  ex:['« Fais grandir ton innovation grâce à un mentorat continu » : séances animées par Pr Hadj Aissa Sid Ahmed le 14 mai 2026.','"Scale your innovation with continuous mentorship": sessions led by Prof. Hadj Aissa Sid Ahmed on 14 May 2026.','«طوّر ابتكارك بمرافقة مستمرة»: جلسات أطّرها أ.د حاج عيسى سيد أحمد يوم 14 ماي 2026.'],
  body:[['Des séances de coaching et de suivi pour les porteurs de projets innovants, le 14 mai 2026 à 9 h.','Partenaires présents sur l\'affiche : l\'université de Bouira, l\'ANVREDET et la NCCFIUE.'],

 {id:'a9',g:'coral',icon:'shield',ph:'label',poster:'label',day:'2026-04-30',tag:['Conférence','Talk','محاضرة'],
  title:['Feuille de route pour obtenir le label « Projet innovant »','A roadmap to securing the "Innovative Project" label','خارطة طريق للحصول على علامة «مشروع مبتكر»'],
  ex:['Conférence de Pr Hadj Aissa Sid Ahmed le 30 avril 2026 à l\'incubateur : « When an Idea Becomes Worthy of Recognition ».','Talk by Prof. Hadj Aissa Sid Ahmed on 30 April 2026 at the incubator: "When an Idea Becomes Worthy of Recognition".','محاضرة أ.د حاج عيسى سيد أحمد يوم 30 أفريل 2026 بالحاضنة: «عندما تصبح الفكرة جديرة بالاعتراف».'],
  body:[['Pr Hadj Aissa Sid Ahmed est coordinateur national des accélérateurs d\'entreprises universitaires et membre de la commission nationale de coordination du suivi de l\'innovation et de l\'entrepreneuriat universitaire, au ministère de l\'Enseignement supérieur et de la Recherche scientifique.','La conférence présentait les étapes pour obtenir le label « Projet innovant ».','Elle s\'est tenue le 30 avril 2026 à 9 h, à l\'incubateur de l\'université de Bouira.'],
        ['Prof. Hadj Aissa Sid Ahmed is National Coordinator of University Business Accelerators and a member of the national coordination committee for innovation follow-up and university entrepreneurship, at the Ministry of Higher Education and Scientific Research.','The talk set out the steps to secure the "Innovative Project" label.','It took place on 30 April 2026 at 9 am at the University of Bouira incubator.'],
        ['أ.د حاج عيسى سيد أحمد هو المنسق الوطني لمسرّعات الأعمال الجامعية وعضو اللجنة الوطنية التنسيقية لمتابعة الابتكار والمقاولاتية الجامعية بوزارة التعليم العالي والبحث العلمي.','عرضت المحاضرة مراحل الحصول على علامة «مشروع مبتكر».','نُظمت يوم 30 أفريل 2026 على الساعة 9 صباحًا بحاضنة جامعة البويرة.']]},
 {id:'a7',g:'cedar',icon:'mic',ph:'chantitak',tag:['Arrêté 1275','Order 1275','القرار 1275'],meta:['Soutenances','Defences','مناقشات'],
  title:['Soutenances 1275 : du mémoire à la startup','1275 defences: from thesis to startup','مناقشات 1275: من المذكرة إلى المؤسسة الناشئة'],
  ex:['À la faculté des sciences économiques, commerciales et de gestion, des étudiants soutiennent des projets comme ChantiTak.','At the Faculty of Economics, Commerce and Management, students defend projects such as ChantiTak.','في كلية العلوم الاقتصادية والتجارية وعلوم التسيير، يناقش الطلبة مشاريع مثل ChantiTak.'],
  body:[['ChantiTak se présente comme la première plateforme numérique pour les entrepreneurs et le secteur des travaux publics, appuyée par l\'intelligence artificielle.','Le projet est soutenu pour l\'obtention d\'une licence et du diplôme « startup », dans le cadre de l\'arrêté 1275.','D\'autres équipes ont présenté l\'organisation de leur future entreprise, comme une gamme de soins au romarin.'],
        ['ChantiTak presents itself as the first AI-powered digital platform for contractors and the public works sector.','The project was defended for a bachelor\'s degree and the "startup" diploma, under order 1275.','Other teams presented the organisation of their future company, such as a rosemary care range.'],
        ['تقدّم ChantiTak نفسها كأول منصة رقمية للمقاولين وقطاع الأشغال العمومية مدعومة بالذكاء الاصطناعي.','نوقش المشروع لنيل شهادة ليسانس وشهادة مؤسسة ناشئة في إطار القرار 1275.','عرضت فرق أخرى تنظيم مؤسستها المستقبلية، مثل تشكيلة منتجات عناية بإكليل الجبل.']]},
 {id:'a1',g:'cedar',icon:'mic',day:'2025-11-19',tag:['Actualité','News','خبر'],
  title:['Semaine de l\'entrepreneuriat 2025 : quatre conférences à l\'université','Entrepreneurship Week 2025: four talks at the university','أسبوع المقاولاتية 2025: أربع محاضرات بالجامعة'],
  ex:['L\'incubateur, le dispositif 1275, l\'ANADE et l\'ANGEM au programme de la journée du 19 novembre 2025.','The incubator, the 1275 scheme, ANADE and ANGEM were on the programme on 19 November 2025.','الحاضنة، القرار 1275، أناد وأونجام في برنامج يوم 19 نوفمبر 2025.'],
  body:[['Pr Samir Aït Oukach, directeur de l\'incubateur, a présenté le rôle de l\'incubateur dans la transformation des idées en projets économiques, avec des exemples de réussite de porteurs de projets.','Dr Belkacem Mesbah a présenté l\'arrêté ministériel 008, qui modifie et complète l\'arrêté 1275, comme mécanisme de création d\'entreprises innovantes en Algérie.','M. Sid Ali Aouacheria (ANGEM) a parlé d\'entrepreneuriat vert et de développement durable. M. Antar Adad (ANADE) a présenté le rôle de l\'agence dans la diffusion de l\'esprit d\'entreprise à l\'université.'],
        ['Prof. Samir Aït Oukach, director of the incubator, explained how the incubator turns ideas into economic projects, with success stories from project holders.','Dr Belkacem Mesbah presented ministerial order 008, which amends and supplements order 1275, as a way to create innovative companies in Algeria.','Mr Sid Ali Aouacheria (ANGEM) spoke about green entrepreneurship and sustainable development. Mr Antar Adad (ANADE) presented the agency\'s role in spreading entrepreneurial thinking at university.'],
        ['قدّم أ.د سمير آيت عكاش، مدير الحاضنة، دور حاضنة الأعمال في تحويل الأفكار إلى مشاريع اقتصادية، مع عرض تجارب ناجحة لحاملي المشاريع الناشئة.','تناول د. بلقاسم مصباح القرار الوزاري 008 المعدل والمتمم للقرار 1275 كآلية لخلق مؤسسات اقتصادية مبتكرة في الجزائر.','تحدث السيد سيد علي عواشرية (أونجام) عن المقاولاتية الخضراء والتنمية المستدامة، وقدّم السيد عنتر أداد (أناد) دور الوكالة في تجسيد الفكر المقاولاتي داخل الوسط الجامعي.']]},
 {id:'a2',g:'ochre',icon:'hand',day:'2025-11-17',tag:['Partenariats','Partnerships','شراكات'],
  title:['Trois nouvelles conventions signées par l\'université','Three new agreements signed by the university','إمضاء ثلاث اتفاقيات جديدة'],
  ex:['Avec l\'EPE CARRAVIC, la Commission nationale des bijoux et le centre Yildiz de formation et d\'enseignement (Turquie).','With the public company CARRAVIC, the National Jewellery Committee and the Yildiz Training and Education Centre (Turkey).','مع المؤسسة العمومية الاقتصادية CARRAVIC، واللجنة الوطنية للمجوهرات، ومركز يلدز للتدريب والتعليم (تركيا).'],
  body:[['Ces trois conventions ont été signées le 17 novembre 2025, pendant la Semaine de l\'entrepreneuriat.','Pour savoir ce qu\'elles peuvent apporter à ton projet, renseigne-toi auprès de l\'incubateur.'],

 {id:'a3',g:'sky',icon:'users',day:'2025-11-17',tag:['Débat','Debate','نقاش'],

  ex:['Une table ronde organisée le 17 novembre 2025, le jour de l\'annonce du Prix de l\'étudiant entrepreneur.','A round table held on 17 November 2025, the day the Student Entrepreneur Award was announced.','مائدة مستديرة نُظمت يوم 17 نوفمبر 2025، يوم الإعلان عن جائزة الطالب المقاول.'],

function drawCode(c,seed){const x=c.getContext('2d'),n=25,s=200/n;x.fillStyle='#fff';x.fillRect(0,0,200,200);x.fillStyle='#13222A';
  let h=0;for(const ch of seed)h=(h*131+ch.charCodeAt(0))>>>0;const rnd=()=>(h=(h*1664525+1013904223)>>>0)/4294967296;
  const finder=(cx,cy)=>{x.fillRect(cx*s,cy*s,7*s,7*s);x.fillStyle='#fff';x.fillRect((cx+1)*s,(cy+1)*s,5*s,5*s);x.fillStyle='#13222A';x.fillRect((cx+2)*s,(cy+2)*s,3*s,3*s)};
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const inF=(i<8&&j<8)||(i>n-9&&j<8)||(i<8&&j>n-9);if(!inF&&rnd()>.52)x.fillRect(i*s,j*s,s,s)}
  finder(0,0);finder(n-7,0);finder(0,n-7);}

function hero(){
  const h=$('#hero'),c=$('#heroCanvas'),x=c.getContext('2d');let W,H,t0=0,px=0,tpx=0;
  const nodes=Array.from({length:28},()=>({x:Math.random(),y:Math.random()*.5+.05,vx:(Math.random()-.5)*.0006,vy:(Math.random()-.5)*.0004,r:Math.random()*1.8+1}));
  function size(){const dpr=Math.min(2,devicePixelRatio||1);W=c.offsetWidth;H=c.offsetHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
  const ridge=(seed,amp,base,freq)=>{const pts=[];for(let k=0;k<=W+20;k+=8){const u=k/W;
    const y=Math.sin(u*freq+seed)*.5+Math.sin(u*freq*2.3+seed*1.7)*.28+Math.sin(u*freq*5.1+seed*.3)*.12+Math.abs(Math.sin(u*freq*.7+seed))*.6;pts.push([k,H*base-y*amp*H])}return pts};
  let R1,R2,R3;function build(){const f=Math.max(1,W/420);R1=ridge(1.2,.17,.62,4.2*f);R2=ridge(3.4,.12,.72,5.6*f);R3=ridge(6.1,.08,.82,7.4*f)}
  function fill(pts,col,off){x.beginPath();x.moveTo(-20,H);pts.forEach(([a,b])=>x.lineTo(a-10+off,b));x.lineTo(W+20,H);x.closePath();x.fillStyle=col;x.fill()}
  function frame(){if(!W||!H||!R1||R1.length<2){if(!RM)requestAnimationFrame(frame);return}t0++;px+=(tpx-px)*.05;x.clearRect(0,0,W,H);
    const vid=h.classList.contains('vid');
    if(!vid){const sx=W*(L==='ar'?.22:.78)+px*6,sy=H*.30+Math.sin(t0/240)*4;const g=x.createRadialGradient(sx,sy,4,sx,sy,70);g.addColorStop(0,'rgba(229,154,43,.95)');g.addColorStop(.25,'rgba(229,154,43,.55)');g.addColorStop(1,'rgba(229,154,43,0)');
    x.fillStyle=g;x.beginPath();x.arc(sx,sy,70,0,7);x.fill();x.fillStyle='#E59A2B';x.beginPath();x.arc(sx,sy,16,0,7);x.fill();}
    nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>1)n.vx*=-1;if(n.y<.05||n.y>.6)n.vy*=-1});
    for(let i=0;i<nodes.length;i++){const a=nodes[i];for(let j=i+1;j<nodes.length;j++){const b=nodes[j];const d=Math.hypot((a.x-b.x)*W,(a.y-b.y)*H);
      if(d<90){x.strokeStyle=vid?`rgba(120,230,220,${(1-d/90)*.4})`:`rgba(15,127,128,${(1-d/90)*.35})`;x.lineWidth=1;x.beginPath();x.moveTo(a.x*W+px*10,a.y*H);x.lineTo(b.x*W+px*10,b.y*H);x.stroke()}}}
    nodes.forEach((n,i)=>{x.fillStyle=i%5?(vid?'rgba(140,235,225,.75)':'rgba(15,127,128,.7)'):'rgba(229,154,43,.95)';x.beginPath();x.arc(n.x*W+px*10,n.y*H,n.r+(i%5?0:Math.sin(t0/20+i)*.8+.8),0,7);x.fill()});
    if(!vid){const top=Math.min(...R1.map(p=>p[1]));const sg=x.createLinearGradient(0,top,0,top+H*.12);sg.addColorStop(0,'#D3EAE6');sg.addColorStop(1,'#A3CEC6');
    fill(R1,sg,px*-8);fill(R2,'#3FA58C',px*-16);fill(R3,'#12807D',px*-26);}
    if(!RM)requestAnimationFrame(frame)}
  const v=$('#heroVid');if(v){v.addEventListener('error',()=>{h.classList.remove('vid');v.remove()});if(RM){try{v.pause()}catch(e){}}else{const pl=v.play&&v.play();pl&&pl.catch&&pl.catch(()=>{})}}
  h.addEventListener('pointermove',e=>{const r=h.getBoundingClientRect();tpx=(e.clientX-r.left)/r.width-.5});h.addEventListener('pointerleave',()=>tpx=0);
  new ResizeObserver(()=>{size();build();if(RM)frame()}).observe(c);size();build();frame();
  hero.redraw=()=>{if(RM)frame()};
}

if(!standalone&&!isDesk()&&Date.now()-later>864e5*3)setTimeout(()=>{if(!isDesk()&&cur==='accueil'&&!$('#sheet').classList.contains('on'))$('#installBar').classList.add('on')},3500);
})();

/* thème clair / sombre */
function themeIsDark(){const t=document.documentElement.dataset.theme;return t==='dark'}
function themeIcon(){const b=document.getElementById('btnTheme');if(!b)return;const d=themeIsDark();b.querySelector('use').setAttribute('href',d?'#i-sun':'#i-moon');b.setAttribute('aria-label',d?'Mode clair':'Mode sombre');b.title=d?'Mode clair':'Mode sombre'}
function toggleTheme(){const t=themeIsDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('incubo:theme',t)}catch(e){}themeIcon();const m=document.querySelector('meta[name="theme-color"]');if(m&&m.dataset.light)m.content=t==='dark'?m.dataset.dark:m.dataset.light}
document.getElementById('btnTheme').onclick=toggleTheme;themeIcon();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeIcon);
(function(){const m=document.querySelector('meta[name="theme-color"]');if(m&&m.dataset.light&&themeIsDark())m.content=m.dataset.dark})();
</script>
